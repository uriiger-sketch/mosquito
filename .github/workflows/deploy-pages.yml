name: Deploy to GitHub Pages

# Deterministic deploy: every push to main builds ONE minified site
# (tools/build-site.sh) and publishes it to both addresses, which never change:
#   • https://uriiger-sketch.github.io/mosquito/ — GitHub Pages (one-time setup:
#     Settings → Pages → Source → "GitHub Actions"; a private repository needs
#     GitHub Pro for Pages)
#   • https://mosquito.charity — the `release` branch (this commit + the site in
#     site/), which Railway deploys and federated_server.py serves at /
#
# Gated: the site is published only after the full CI suite (ci.yml) passes —
# JS unit tests + detector benchmark, server tests, and the browser end-to-end
# suite, and the backend image smoke test (Railway builds `release` from the
# Dockerfile). The e2e gate matters doubly here: the service worker caches what
# we ship on users' devices, so a broken build would outlive its own rollback.
#
# Least privilege: the build job runs third-party code (the npm minifiers), so
# it holds a read-only token and no persisted credentials. Only the deploy job
# can push `release` and deploy Pages, and it runs no npm code at all — it
# publishes the artifact the build produced. Every action is pinned to a
# commit SHA (the tag in the comment), so moving a tag can't change what runs.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Emergency only: publish without waiting for the browser end-to-end suite'
        type: boolean
        default: false

# Nothing by default: every job states exactly what it needs.
permissions: {}

# Never run two deploys at once; always let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read                    # the tests need no write access
    with:
      skip_e2e: ${{ inputs.skip_e2e == true }}

  build:
    name: Build the site
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: a restored cache is files nobody reviewed, extracted into
      # the workspace. npm ci checks every package against the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the minifiers
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The one build both hosts publish: repo minus non-site paths, stamped
      # (app-code URLs, version X.Y.<run number>, optional backend list),
      # minified, given its CSP <meta>, and checked for leaks and symlinks.
      # See tools/build-site.sh.
      - name: Build the site
        env:
          SITE_SHA: ${{ github.sha }}
          SITE_RUN: ${{ github.run_number }}
          # Optional repository variable (Settings → Secrets and variables →
          # Actions → Variables): comma-separated backend origins, tried in
          # order — e.g. the Railway domain while a custom domain's DNS isn't
          # live. Unset = keep the SERVER_URLS list in index.html.
          SERVER_URLS: ${{ vars.SERVER_URLS }}
        run: bash tools/build-site.sh _site

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish (release branch + Pages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write                   # push the release branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # Railway deploys the `release` branch: this commit's tree plus the site
      # above in site/, which federated_server.py serves at / — so
      # https://mosquito.charity runs exactly this tested build, and the backend
      # itself only ever ships after the full test suite passed. Fast-forward
      # only: each release commit's first parent is the previous release.
      # Pushed before Pages, so the backend never depends on Pages succeeding.
      - name: Publish the release branch (backend + app, for Railway)
        run: |
          set -euo pipefail
          VERSION="$(sed -n -E "s/^const APP_VERSION = '([0-9]+\.[0-9]+)\.[0-9]+';$/\1/p" index.html).${GITHUB_RUN_NUMBER}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf site && mkdir site
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C site
          odd=$(find site ! -type f ! -type d -print)
          if [ -n "$odd" ]; then echo "::error::symlinks or special files in the artifact:"; echo "$odd"; exit 1; fi
          git add -A site
          tree=$(git write-tree)
          parents=()
          if git fetch --quiet --depth=1 origin release; then parents+=(-p FETCH_HEAD); fi
          parents+=(-p "$GITHUB_SHA")
          commit=$(git commit-tree "$tree" "${parents[@]}" -m "Release v$VERSION (${GITHUB_SHA::7})")
          git push origin "$commit:refs/heads/release"
          echo "release → $commit (v$VERSION)"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
