name: Deploy to GitHub Pages

# Deterministic deploy: every push to main republishes the site to the SAME
# permanent address — https://uriiger-sketch.github.io/mosquito/ — which never
# changes between deployments. (One-time setup: repo Settings → Pages → Build and
# deployment → Source → "GitHub Actions".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root — index.html plus the icon and PWA assets.
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
