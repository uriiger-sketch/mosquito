name: Deploy to GitHub Pages

# Deterministic deploy: every push to main builds ONE minified site
# (tools/build-site.sh) and publishes it to both addresses, which never change:
#   • https://uriiger-sketch.github.io/mosquito/ — GitHub Pages (one-time setup:
#     Settings → Pages → Source → "GitHub Actions"; a private repository needs
#     GitHub Pro for Pages)
#   • https://mosquito.charity — the `release` branch (this commit + the site in
#     site/), which Railway deploys and federated_server.py serves at /
#
# Gated: the site is published only after the full CI suite (ci.yml) passes —
# JS unit tests + detector benchmark, server tests, and the browser end-to-end
# suite. The e2e gate matters doubly here: the service worker caches what we
# ship on users' devices, so a broken build would outlive its own rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Emergency only: publish without waiting for the browser end-to-end suite'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read                    # the tests need no write access
    with:
      skip_e2e: ${{ inputs.skip_e2e == true }}
      skip_docker: true                 # backend image doesn't affect the static site

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write                   # push the release branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the minifiers
        run: npm ci --no-audit --no-fund

      # The one build both hosts publish: repo minus non-site paths, stamped
      # (app-code URLs, version X.Y.<run number>, optional backend list) and
      # minified. See tools/build-site.sh.
      - name: Build the site
        env:
          SITE_SHA: ${{ github.sha }}
          SITE_RUN: ${{ github.run_number }}
          # Optional repository variable (Settings → Secrets and variables →
          # Actions → Variables): comma-separated backend origins, tried in
          # order — e.g. the Railway domain while a custom domain's DNS isn't
          # live. Unset = keep the SERVER_URLS list in index.html.
          SERVER_URLS: ${{ vars.SERVER_URLS }}
        run: bash tools/build-site.sh _site

      # Railway deploys the `release` branch: this commit's tree plus the site
      # above in site/, which federated_server.py serves at / — so
      # https://mosquito.charity runs exactly this tested build, and the backend
      # itself only ever ships after the full test suite passed. Fast-forward
      # only: each release commit's first parent is the previous release.
      # Pushed before Pages, so the backend never depends on Pages succeeding.
      - name: Publish the release branch (backend + app, for Railway)
        run: |
          set -euo pipefail
          VERSION="$(sed -n -E "s/^const APP_VERSION = '([0-9]+\.[0-9]+)\.[0-9]+';$/\1/p" index.html).${GITHUB_RUN_NUMBER}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf site && cp -R _site site
          git add -A site
          tree=$(git write-tree)
          parents=()
          if git fetch --quiet --depth=1 origin release; then parents+=(-p FETCH_HEAD); fi
          parents+=(-p "$GITHUB_SHA")
          commit=$(git commit-tree "$tree" "${parents[@]}" -m "Release v$VERSION (${GITHUB_SHA::7})")
          git push origin "$commit:refs/heads/release"
          echo "release → $commit (v$VERSION)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
