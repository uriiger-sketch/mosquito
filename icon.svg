<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MosquitoNet">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0b2436"/>
      <stop offset="55%" stop-color="#061422"/>
      <stop offset="100%" stop-color="#02080f"/>
    </radialGradient>
    <linearGradient id="mos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ffce9"/>
      <stop offset="55%" stop-color="#00e8c0"/>
      <stop offset="100%" stop-color="#00b899"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e8c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e8c0" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded panel -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#00e8c0" stroke-opacity="0.16" stroke-width="3"/>

  <!-- sonar rings emanating from lower-left -->
  <g fill="none" stroke="#00e8c0" stroke-linecap="round">
    <circle cx="150" cy="366" r="88"  stroke-opacity="0.30" stroke-width="4"/>
    <circle cx="150" cy="366" r="140" stroke-opacity="0.18" stroke-width="4"/>
    <circle cx="150" cy="366" r="196" stroke-opacity="0.09" stroke-width="4"/>
  </g>

  <!-- mosquito, angled -->
  <g filter="url(#glow)" transform="rotate(-18 256 256)">
    <!-- wings -->
    <g fill="url(#wing)" stroke="#00e8c0" stroke-opacity="0.5" stroke-width="2.5">
      <path d="M262 214 C 330 150, 402 150, 430 196 C 402 224, 322 236, 262 226 Z"/>
      <path d="M262 220 C 322 188, 398 206, 424 250 C 384 268, 312 258, 260 236 Z"/>
    </g>

    <!-- legs (long, bent) -->
    <g fill="none" stroke="url(#mos)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 250 C 210 250, 150 270, 96 214"/>
      <path d="M256 262 C 210 286, 150 320, 92 300"/>
      <path d="M262 272 C 224 320, 176 372, 132 392"/>
      <path d="M258 244 C 300 232, 356 228, 404 176"/>
      <path d="M264 258 C 312 266, 372 280, 418 262"/>
      <path d="M268 270 C 314 300, 356 350, 372 404"/>
    </g>

    <!-- abdomen (segmented, tapering) -->
    <path d="M254 260 C 268 296, 278 344, 268 402 C 258 418, 244 418, 236 402 C 232 348, 240 296, 244 262 Z" fill="url(#mos)"/>
    <g stroke="#02080f" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
      <path d="M244 300 L 270 300"/>
      <path d="M242 330 L 272 330"/>
      <path d="M241 360 L 268 360"/>
      <path d="M243 386 L 262 386"/>
    </g>

    <!-- thorax -->
    <ellipse cx="252" cy="250" rx="26" ry="22" fill="url(#mos)"/>
    <!-- head -->
    <circle cx="236" cy="214" r="15" fill="url(#mos)"/>
    <!-- proboscis -->
    <path d="M230 206 L 196 150" stroke="url(#mos)" stroke-width="6" stroke-linecap="round"/>
    <!-- antennae -->
    <g stroke="url(#mos)" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-opacity="0.9">
      <path d="M228 206 C 214 186, 206 176, 214 160"/>
      <path d="M240 202 C 236 180, 240 168, 252 158"/>
    </g>
    <!-- eye highlight -->
    <circle cx="232" cy="212" r="4.5" fill="#02080f" fill-opacity="0.6"/>
  </g>
</svg>
