# Python tests for the federated server (tests/server). The JavaScript unit tests
# under tests/*.test.js run with `npm test`.
# Kept as pytest.ini rather than pyproject.toml on purpose: a pyproject.toml at
# the repo root changes how Railway/Render/Nixpacks detect and install the app.
[pytest]
testpaths = tests/server
addopts = -ra --strict-markers
